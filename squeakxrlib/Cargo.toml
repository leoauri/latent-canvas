[package]
name = "redaw-peer"
version = "0.1.0"
edition = "2021"
description = "Native peer for redaw (latent-canvas) sessions: joins the WebRTC room and syncs the Automerge document"

[lib]
name = "redaw_peer"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "redaw-peer-cli"
path = "src/main.rs"

[dependencies]
automerge = "0.12"
webrtc = "0.21"
rtc = "0.21"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
url = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tract-onnx = "0.23"

[profile.release]
lto = true
codegen-units = 1
